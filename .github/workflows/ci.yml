name: DistributorOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: distributoros_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-admin-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d distributoros_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://distributoros_runtime:test-runtime-password@localhost:5432/distributoros_test
      TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://distributoros_migrator:test-migrator-password@localhost:5432/distributoros_test
      TEST_DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://postgres:test-admin-password@localhost:5432/postgres
      DATABASE_URL: postgresql+asyncpg://distributoros_runtime:test-runtime-password@localhost:5432/distributoros_test
      DATABASE_MIGRATION_URL: postgresql+asyncpg://distributoros_migrator:test-migrator-password@localhost:5432/distributoros_test
      DATABASE_ADMIN_URL: postgresql+asyncpg://distributoros_migrator:test-migrator-password@localhost:5432/distributoros_test
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_WEB_API_URL: https://distributoros-api.onrender.com/api/v1
      EXPO_PUBLIC_ANDROID_API_URL: https://distributoros-api.onrender.com/api/v1
      EXPO_PUBLIC_IOS_API_URL: https://distributoros-api.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "./services/api[dev]"
      - name: Provision migration and runtime database roles
        env:
          PGPASSWORD: test-admin-password
        run: |
          psql -h localhost -U postgres -d distributoros_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE distributoros_migrator LOGIN PASSWORD 'test-migrator-password' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE distributoros_runtime LOGIN PASSWORD 'test-runtime-password' NOSUPERUSER NOBYPASSRLS;
          ALTER SCHEMA public OWNER TO distributoros_migrator;
          GRANT CONNECT ON DATABASE distributoros_test TO distributoros_migrator, distributoros_runtime;
          GRANT USAGE, CREATE ON SCHEMA public TO distributoros_migrator;
          SQL
      - run: python -m ruff check src migrations tests
        working-directory: services/api
      - run: python -m mypy src
        working-directory: services/api
      - run: python -m pytest -q
        working-directory: services/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python scripts/export_openapi.py
        working-directory: services/api
      - run: npm run api:generate
      - run: git diff --exit-code packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - run: npm run export:web --workspace @distributoros/mobile
      - run: docker build -f services/api/Dockerfile services/api
